[project]
name = "aura-assistant"
version = "0.1.0"
description = "AI Universal Responsive Assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6",
    "sounddevice",
    "faster-whisper",
    "pyttsx3",
    "openai",
    "python-dotenv",
    "mss",
    "pyautogui",
    "pywinauto",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"